<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
	body {
		font-family: Arial, sans-serif;
		margin: 20px;
	}
	#fileInput {
		margin: 10px 0;
	}
	#status {
		margin: 10px 0;
		color: #666;
	}
	#result {
		margin-top: 20px;
	}
	.result-item {
		margin: 20px 0;
		position: relative;
		display: inline-block;
	}
	.result-item img {
		max-width: 500px;
		height: auto;
		display: block;
	}
	.result-item canvas {
		position: absolute;
		top: 0;
		left: 0;
		pointer-events: none;
	}
	#objectSummary {
		margin-top: 20px;
		padding: 15px;
		background-color: #f5f5f5;
		border-radius: 8px;
		border: 1px solid #ddd;
	}
	#objectSummary h3 {
		margin-top: 0;
		color: #333;a
	}
	.summary-item {
		display: flex;
		justify-content: space-between;
		align-items: center;
		padding: 10px;
		margin: 5px 0;
		background-color: white;
		border-radius: 5px;
		border-left: 4px solid;
	}
	.summary-item .label {
		font-weight: bold;
		font-size: 16px;
	}
	.summary-item .count {
		font-size: 18px;
		color: #666;
	}
	.summary-item .confidence {
		font-size: 14px;
		color: #888;
	}
	.no-detections {
		color: #999;
		font-style: italic;
		padding: 10px;
	}
</style>
</head>
<body>
	<div>
		<p>test</p>
		<br>
		<input type="file" accept="image/*" multiple id="fileInput">
		<div id="status">Memuat model...</div>
	</div>
	<div id="result"></div>
	<div id="objectSummary" style="display: none;">
		<h3>Jenis Objek yang Terdeteksi:</h3>
		<div id="summaryContent"></div>
	</div>

	<script>
		const classNames = ['Half-Ripe', 'Not_Mango', 'OverRipe', 'Ripe', 'Unripe'];
		const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8'];
		
		let model = null;
		const MODEL_PATH = 'best.onnx';
		const INPUT_SIZE = 640;
		const CONF_THRESHOLD = 0.25;

		// Load model
		async function loadModel() {
			try {
				updateStatus('Memuat model...', '#666');
				model = await ort.InferenceSession.create(MODEL_PATH, {
					executionProviders: ['wasm']
				});
				updateStatus('Model siap digunakan', '#4CAF50');
				console.log('Model loaded:', model.inputNames, model.outputNames);
			} catch (error) {
				updateStatus('Error: ' + error.message, '#F44336');
				console.error('Load error:', error);
			}
		}

		function updateStatus(text, color) {
			const el = document.getElementById('status');
			el.textContent = text;
			el.style.color = color;
		}

		// Preprocess image
		function preprocess(img) {
			const canvas = document.createElement('canvas');
			const ctx = canvas.getContext('2d');
			canvas.width = INPUT_SIZE;
			canvas.height = INPUT_SIZE;
			
			const scale = Math.min(INPUT_SIZE / img.width, INPUT_SIZE / img.height);
			const w = img.width * scale;
			const h = img.height * scale;
			const x = (INPUT_SIZE - w) / 2;
			const y = (INPUT_SIZE - h) / 2;
			
			ctx.fillStyle = '#000';
			ctx.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
			ctx.drawImage(img, x, y, w, h);
			
			const data = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
			const tensor = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);
			
			for (let i = 0; i < INPUT_SIZE * INPUT_SIZE; i++) {
				tensor[i] = data[i * 4] / 255.0;
				tensor[i + INPUT_SIZE * INPUT_SIZE] = data[i * 4 + 1] / 255.0;
				tensor[i + 2 * INPUT_SIZE * INPUT_SIZE] = data[i * 4 + 2] / 255.0;
			}
			
			return { tensor, scale, x, y, origW: img.width, origH: img.height };
		}

		// Postprocess output
		function postprocess(output, scale, x, y, origW, origH) {
			const detections = [];
			const data = output.data;
			const dims = output.dims;
			
			// YOLO format: [batch, features, detections] atau [batch, detections, features]
			let numDets, numFeats;
			
			if (dims.length === 3) {
				if (dims[1] === 84 || dims[1] === (4 + classNames.length)) {
					// Format [1, 84, 8400]
					numDets = dims[2];
					numFeats = dims[1];
					
					for (let i = 0; i < numDets; i++) {
						const x_center = data[i] * INPUT_SIZE;
						const y_center = data[numDets + i] * INPUT_SIZE;
						const width = data[2 * numDets + i] * INPUT_SIZE;
						const height = data[3 * numDets + i] * INPUT_SIZE;
						
						let maxConf = 0;
						let maxClass = 0;
						for (let j = 0; j < numFeats - 4; j++) {
							const conf = data[(4 + j) * numDets + i];
							if (conf > maxConf) {
								maxConf = conf;
								maxClass = j;
							}
						}
						
						if (maxConf > CONF_THRESHOLD) {
							const boxX = (x_center - width / 2 - x) / scale;
							const boxY = (y_center - height / 2 - y) / scale;
							detections.push({
								x: Math.max(0, boxX),
								y: Math.max(0, boxY),
								w: width / scale,
								h: height / scale,
								conf: maxConf,
								cls: maxClass
							});
						}
					}
				} else if (dims[2] === 6) {
					// Format [1, detections, 6]
					numDets = dims[1];
					for (let i = 0; i < numDets; i++) {
						const idx = i * 6;
						const conf = data[idx + 4];
						if (conf > CONF_THRESHOLD) {
							const x_center = data[idx] * INPUT_SIZE;
							const y_center = data[idx + 1] * INPUT_SIZE;
							const width = data[idx + 2] * INPUT_SIZE;
							const height = data[idx + 3] * INPUT_SIZE;
							const cls = Math.round(data[idx + 5]);
							
							detections.push({
								x: Math.max(0, (x_center - width / 2 - x) / scale),
								y: Math.max(0, (y_center - height / 2 - y) / scale),
								w: width / scale,
								h: height / scale,
								conf: conf,
								cls: cls
							});
						}
					}
				}
			}
			
			// Simple NMS
			detections.sort((a, b) => b.conf - a.conf);
			const filtered = [];
			for (const det of detections) {
				let overlap = false;
				for (const existing of filtered) {
					const iou = getIOU(det, existing);
					if (iou > 0.5) {
						overlap = true;
						break;
					}
				}
				if (!overlap) filtered.push(det);
			}
			
			return filtered;
		}

		function getIOU(box1, box2) {
			const x1 = Math.max(box1.x, box2.x);
			const y1 = Math.max(box1.y, box2.y);
			const x2 = Math.min(box1.x + box1.w, box2.x + box2.w);
			const y2 = Math.min(box1.y + box1.h, box2.y + box2.h);
			if (x2 < x1 || y2 < y1) return 0;
			const inter = (x2 - x1) * (y2 - y1);
			const area1 = box1.w * box1.h;
			const area2 = box2.w * box2.h;
			return inter / (area1 + area2 - inter);
		}

		// Tampilkan summary objek yang terdeteksi
		function showObjectSummary(detections) {
			const summaryDiv = document.getElementById('objectSummary');
			const summaryContent = document.getElementById('summaryContent');
			
			if (detections.length === 0) {
				summaryDiv.style.display = 'none';
				return;
			}
			
			// Hitung jumlah dan confidence rata-rata per kelas
			const classStats = {};
			detections.forEach(det => {
				const className = classNames[det.cls];
				if (!classStats[className]) {
					classStats[className] = {
						count: 0,
						totalConf: 0,
						classIndex: det.cls
					};
				}
				classStats[className].count++;
				classStats[className].totalConf += det.conf;
			});
			
			// Buat HTML untuk summary
			let html = '';
			const sortedClasses = Object.keys(classStats).sort((a, b) => 
				classStats[b].count - classStats[a].count
			);
			
			sortedClasses.forEach(className => {
				const stats = classStats[className];
				const avgConf = (stats.totalConf / stats.count) * 100;
				const color = colors[stats.classIndex % colors.length];
				
				html += `
					<div class="summary-item" style="border-left-color: ${color};">
						<div>
							<div class="label">${className}</div>
							<div class="confidence">Confidence rata-rata: ${avgConf.toFixed(1)}%</div>
						</div>
						<div class="count">${stats.count} ${stats.count === 1 ? 'objek' : 'objek'}</div>
					</div>
				`;
			});
			
			// Tambahkan total
			html += `
				<div style="margin-top: 15px; padding-top: 15px; border-top: 2px solid #ddd;">
					<strong>Total: ${detections.length} objek terdeteksi</strong>
				</div>
			`;
			
			summaryContent.innerHTML = html;
			summaryDiv.style.display = 'block';
		}

		// Draw detections
		function draw(canvas, detections, imgW, imgH) {
			const ctx = canvas.getContext('2d');
			canvas.width = imgW;
			canvas.height = imgH;
			ctx.clearRect(0, 0, imgW, imgH);
			
			detections.forEach(det => {
				const x = Math.max(0, det.x);
				const y = Math.max(0, det.y);
				const w = Math.min(det.w, imgW - x);
				const h = Math.min(det.h, imgH - y);
				const color = colors[det.cls % colors.length];
				
				ctx.strokeStyle = color;
				ctx.lineWidth = 3;
				ctx.strokeRect(x, y, w, h);
				
				const label = `${classNames[det.cls]} ${(det.conf * 100).toFixed(1)}%`;
				ctx.font = '16px Arial';
				const textW = ctx.measureText(label).width;
				
				ctx.fillStyle = color;
				ctx.fillRect(x, y - 20, textW + 10, 20);
				ctx.fillStyle = '#fff';
				ctx.fillText(label, x + 5, y - 5);
			});
		}

		// Process image
		async function processImage(file) {
			return new Promise((resolve, reject) => {
				const img = new Image();
				img.onload = async () => {
					try {
						if (!model) {
							reject(new Error('Model belum dimuat'));
							return;
						}
						
						const { tensor, scale, x, y, origW, origH } = preprocess(img);
						
						// Gunakan default shape jika inputMetadata tidak tersedia
						const inputShape = [1, 3, INPUT_SIZE, INPUT_SIZE];
						const inputTensor = new ort.Tensor('float32', tensor, inputShape);
						const feeds = { [model.inputNames[0]]: inputTensor };
						
						const results = await model.run(feeds);
						const output = results[model.outputNames[0]];
						
						const detections = postprocess(output, scale, x, y, origW, origH);
						resolve({ img, detections, origW, origH });
					} catch (error) {
						reject(error);
					}
				};
				img.onerror = () => reject(new Error('Gagal memuat gambar'));
				img.src = URL.createObjectURL(file);
			});
		}

		// Handle file input
		document.getElementById('fileInput').addEventListener('change', async (e) => {
			const files = Array.from(e.target.files);
			const container = document.getElementById('result');
			container.innerHTML = '';
			
			// Reset summary
			document.getElementById('objectSummary').style.display = 'none';
			
			// Kumpulkan semua detections dari semua gambar
			let allDetections = [];
			
			for (const file of files) {
				try {
					const { img, detections, origW, origH } = await processImage(file);
					
					// Tambahkan ke total detections
					allDetections = allDetections.concat(detections);
					
					const div = document.createElement('div');
					div.className = 'result-item';
					
					const displayImg = document.createElement('img');
					displayImg.src = img.src;
					displayImg.style.width = origW > 500 ? '500px' : origW + 'px';
					
					const canvas = document.createElement('canvas');
					canvas.style.width = displayImg.style.width;
					
					div.appendChild(displayImg);
					div.appendChild(canvas);
					container.appendChild(div);
					
					displayImg.onload = () => {
						const scale = displayImg.offsetWidth / origW;
						const scaled = detections.map(d => ({
							...d,
							x: d.x * scale,
							y: d.y * scale,
							w: d.w * scale,
							h: d.h * scale
						}));
						draw(canvas, scaled, displayImg.offsetWidth, displayImg.offsetHeight);
					};
				} catch (error) {
					console.error('Error:', error);
					alert('Error: ' + error.message);
				}
			}
			
			// Tampilkan summary setelah semua gambar diproses
			if (allDetections.length > 0) {
				showObjectSummary(allDetections);
			} else if (files.length > 0) {
				// Jika tidak ada deteksi sama sekali
				const summaryDiv = document.getElementById('objectSummary');
				const summaryContent = document.getElementById('summaryContent');
				summaryContent.innerHTML = '<div class="no-detections">Tidak ada objek yang terdeteksi pada gambar.</div>';
				summaryDiv.style.display = 'block';
			}
		});

		// Load model on start
		loadModel();
	</script>
</body>
</html>
